name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ВАЖНО: Ставим переменную ДО установки buildozer
      - name: Enable auto-accept licenses for Buildozer
        run: echo "BUILD_OS_ACCEPT_LICENSES=1" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libreadline-dev libsqlite3-dev wget curl llvm libncursesw5-dev build-essential

      - name: Install buildozer
        run: pip install buildozer

      # ЖЁСТКИЙ СБРОС КЭША: удаляем всё, где Buildozer мог запомнить версию 37.0.0
      - name: Clean Buildozer Cache
        run: rm -rf /home/runner/.buildozer

      - name: Build APK
        # -v — подробный лог, чтобы видеть, что происходит
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
