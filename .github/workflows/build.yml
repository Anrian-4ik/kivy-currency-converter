name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libreadline-dev libsqlite3-dev wget curl llvm libncursesw5-dev build-essential

      - name: Install buildozer
        run: pip install buildozer

      # ЭТОТ ШАГ КРИТИЧЕСКИ ВАЖЕН:
      # Мы удаляем папку .buildozer, чтобы стереть память о том, 
      # что "нужна версия 37.0.0". Без этого шага сборка снова попросит её.
      - name: Clean Buildozer Cache
        run: rm -rf /home/runner/.buildozer

      # ГЛАВНЫЙ ТРЮК:
      # Переменная BUILD_OS_ACCEPT_LICENSES=1 говорит Buildozer:
      # "Когда будешь скачивать SDK, автоматически соглашайся со всеми лицензиями".
      # Это сработает ТОЛЬКО если мы не требуем конкретную старую версию.
      - name: Enable auto-accept licenses
        run: echo "BUILD_OS_ACCEPT_LICENSES=1" >> $GITHUB_ENV

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
