name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libreadline-dev libsqlite3-dev wget curl llvm libncursesw5-dev build-essential

      - name: Install buildozer
        run: pip install buildozer

      # ЖЁСТКИЙ СБРОС КЭША — обязательно, чтобы не тянулись старые настройки
      - name: Clean Buildozer Cache
        run: rm -rf /home/runner/.buildozer
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "8933bab16c5c12bc9dbece5f0e51fc0630e3843a" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb137a64540" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

      - name: Build APK
        # -v — подробный лог, чтобы видеть, какую версию build-tools он реально берёт
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
